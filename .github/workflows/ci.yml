# Foundation CI: verification only. No deployment, no Pages switch, no secrets, no contact to Supabase.
# GitHub Pages keeps publishing from `main` as before (cutover needs separate approval).
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, 'feature/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/e2e.mjs smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
